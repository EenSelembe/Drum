<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>LOGIN</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#121212">
<link rel="icon" href="icon.png">

<style>
body {
  font-family: Arial;
  background: #121212;
  color: white;
  display: flex;
  height: 100vh;
  justify-content: center;
  align-items: center;
  margin: 0;
}

.login-box {
  background: #1e1e1e;
  padding: 20px;
  border-radius: 10px;
  width: 250px;
  text-align: center;
  box-shadow: 0 0 10px rgba(0,255,0,0.3);
}

input {
  width: 100%;
  padding: 10px;
  margin: 10px 0;
  border: none;
  border-radius: 5px;
  outline: none;
}

button {
  width: 100%;
  padding: 10px;
  border: none;
  background: green;
  color: white;
  border-radius: 5px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  opacity: 0.9;
}
</style>
</head>

<body>

<div class="login-box">
  <h2>LOGIN</h2>

  <input type="text" id="username" placeholder="Username">
  <input type="password" id="password" placeholder="Password">

  <button onclick="login()">Login</button>
</div>

<script>

// LOGIN SYSTEM
function login(){

  const user = document.getElementById("username").value;
  const pass = document.getElementById("password").value;

  // ADMIN
  if(user === "admin" && pass === "admin123"){
    localStorage.setItem("role","admin");
    location.href = "menu.html";
  }

  // OPERATOR
  else if(user === "operator" && pass === "6478807"){
    localStorage.setItem("role","user");
    location.href = "menu.html";
  }

  else{
    alert("Username atau password salah!");
  }
}

// SERVICE WORKER (BIAR BISA INSTALL)
if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("service-worker.js")
    .then(() => console.log("App siap di install"))
    .catch(err => console.log("Gagal SW", err));
}

</script>

</body>
</html>
