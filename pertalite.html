<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PERTALITE SYSTEM FINAL</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:#fff;
  padding:15px;
}

h2{text-align:center;}

#roleBox{
  text-align:center;
  background:#222;
  padding:8px;
  margin-bottom:10px;
}

.total{
  background:#222;
  padding:10px;
  margin-bottom:10px;
  text-align:center;
}

input,button{
  padding:8px;
  margin:4px 0;
  width:100%;
  font-size:14px;
}

button{
  background:green;
  color:white;
  border:none;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

.small{
  width:70px;
}

.del{
  background:red;
  color:white;
  border:none;
  width:30px;
  cursor:pointer;
}

.red{
  background:red;
  color:white;
}

.editable{
  cursor:pointer;
  color:#00d4ff;
}
</style>
</head>

<body>

<h2>DATA PERTALITE</h2>

<div id="roleBox">ROLE: <span id="roleText"></span></div>

<div class="total" id="totalBox">Loading...</div>

<div id="adminForm"></div>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Stock</th>
<th>Update</th>
<th>Transaksi</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabel"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "APIKEY",
  authDomain: "xxx.firebaseapp.com",
  databaseURL: "https://xxx.asia-southeast1.firebasedatabase.app",
  projectId: "xxx",
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let role = localStorage.getItem("role");

if(!role){
  alert("Login dulu");
  location.href="index.html";
}

document.getElementById("roleText").innerText = role;

if(role==="admin"){
  adminForm.innerHTML = `
    <input id="nama" placeholder="Nama">
    <input id="stok" type="number" placeholder="Stock">
    <button onclick="tambah()">Tambah</button>
  `;
}

let data={};

onValue(ref(db,"pertalite"),snap=>{
  data=snap.val()||{};
  render();
});

function totalTransaksi(arr){
  return (arr||[]).reduce((a,b)=>a+b,0);
}

function render(){
  tabel.innerHTML="";
  let arr=Object.entries(data);

  arr.forEach(([key,d],i)=>{

    if(!d.transaksi) d.transaksi=[];

    let kolom="";

    d.transaksi.forEach((v,j)=>{
      kolom+=`
        <div>
          <input class="small" type="number" value="${v}"
            ${role==="user" ? `onchange="edit('${key}',${j},this)"`:"disabled"}>
          ${role==="user" ? `<button class="del" onclick="hapusTransaksi('${key}',${j})">-</button>`:""}
        </div>
      `;
    });

    if(role==="user" && d.update>0){
      kolom+=`
        <input class="small" type="number" placeholder="+"
          onchange="auto('${key}',this)">
      `;
    }

    tabel.innerHTML+=`
      <tr>
        <td>${i+1}</td>
        <td class="${role==="admin"?"editable":""}" onclick="editNama('${key}')">${d.nama}</td>
        <td class="${role==="admin"?"editable":""}" onclick="editStock('${key}')">${d.stock}</td>
        <td>${d.update}</td>
        <td>${kolom}</td>
        <td>${role==="admin"?`<button class="del" onclick="hapus('${key}')">🗑️</button>`:""}</td>
      </tr>
    `;
  });

  hitung();
}

function hitung(){
  let total=0;
  Object.values(data).forEach(d=>{
    total+=totalTransaksi(d.transaksi);
  });

  totalBox.innerHTML=
    "Total: "+total+" L<br>Rp "+(total*10000).toLocaleString("id-ID");
}

window.tambah=function(){
  let nama=nama.value;
  let stok=parseFloat(stok.value);

  if(!nama||isNaN(stok)) return;

  let r=push(ref(db,"pertalite"));

  set(r,{
    nama,
    stock:stok,
    update:stok,
    transaksi:[]
  });

  document.getElementById("nama").value="";
  document.getElementById("stok").value="";
};

window.auto=function(key,input){
  let val=parseFloat(input.value);
  let d=data[key];

  if(isNaN(val)) return;

  if(val>d.update){
    alert("Melebihi sisa!");
    input.value="";
    return;
  }

  d.transaksi.push(val);
  d.update-=val;

  set(ref(db,"pertalite/"+key),d);
  input.value="";
};

window.edit=function(key,i,input){
  let val=parseFloat(input.value);
  let d=data[key];
  let old=d.transaksi[i];

  if(isNaN(val)) return;

  let selisih=val-old;

  if(selisih>d.update){
    alert("Melebihi sisa!");
    input.value=old;
    return;
  }

  d.transaksi[i]=val;
  d.update-=selisih;

  set(ref(db,"pertalite/"+key),d);
};

window.hapusTransaksi=function(key,i){
  let d=data[key];
  let val=d.transaksi[i];

  d.update+=val;
  d.transaksi.splice(i,1);

  set(ref(db,"pertalite/"+key),d);
};

window.editNama=function(key){
  if(role!=="admin")return;

  let d=data[key];
  let n=prompt("Nama:",d.nama);

  if(n){
    d.nama=n;
    set(ref(db,"pertalite/"+key),d);
  }
};

window.editStock=function(key){
  if(role!=="admin")return;

  let d=data[key];
  let s=parseFloat(prompt("Stock:",d.stock));

  if(isNaN(s)) return;

  let total=totalTransaksi(d.transaksi);

  if(s<total){
    alert("Stock < transaksi!");
    return;
  }

  d.stock=s;
  d.update=s-total;

  set(ref(db,"pertalite/"+key),d);
};

window.hapus=function(key){
  remove(ref(db,"pertalite/"+key));
};
</script>

</body>
</html>
