<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>PERTALITE SYSTEM FINAL</title>

<style>
body{
  font-family:Arial;
  background:#111;
  color:#fff;
  padding:15px;
}

h2{text-align:center;}

#roleBox{
  text-align:center;
  background:#222;
  padding:8px;
  margin-bottom:10px;
}

.total{
  background:#222;
  padding:10px;
  margin-bottom:10px;
  text-align:center;
}

input,button{
  padding:8px;
  margin:4px 0;
  width:100%;
  font-size:14px;
}

button{
  background:green;
  color:white;
  border:none;
  cursor:pointer;
}

.copyBtn{
  background:orange;
  margin-bottom:10px;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  border:1px solid #444;
  padding:6px;
  text-align:center;
}

.small{
  width:70px;
}

.del{
  background:red;
  color:white;
  border:none;
  width:30px;
  cursor:pointer;
}

.red{
  background:red;
  color:white;
}

.editable{
  color:#00d4ff;
  cursor:pointer;
}
</style>
</head>

<body>

<h2>DATA PERTALITE</h2>

<button class="copyBtn" onclick="copyScript()">📋 COPY SCRIPT</button>

<div id="roleBox">ROLE: <span id="roleText"></span></div>

<div class="total" id="totalBox">Loading...</div>

<div id="adminForm"></div>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Stock</th>
<th>Update</th>
<th>Transaksi</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tabel"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getDatabase,
  ref,
  set,
  push,
  onValue,
  remove
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyCgLz1_bFzcFzGEbYSIHRpoy3acReyuB7Y",
  authDomain: "drum-26d1c.firebaseapp.com",
  databaseURL: "https://drum-26d1c-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "drum-26d1c",
  storageBucket: "drum-26d1c.firebasestorage.app",
  messagingSenderId: "960892789351",
  appId: "1:960892789351:web:ca1c653c85cab59586eac2"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let role = localStorage.getItem("role");

if(!role){
  alert("Silakan login dulu");
  window.location.href = "index.html";
}

document.getElementById("roleText").innerText = role.toUpperCase();

if(role === "admin"){
  document.getElementById("adminForm").innerHTML = `
    <h3>Tambah Data</h3>
    <input id="nama" placeholder="Nama">
    <input id="stok" type="number" placeholder="Stock">
    <button onclick="tambah()">TAMBAH</button>
  `;
}

let data = {};

onValue(ref(db,"pertalite"), snap=>{
  data = snap.val() || {};
  render();
});

function hitungTotal(){
  let total = 0;
  Object.values(data).forEach(d=>{
    total += (d.stock - d.update);
  });

  document.getElementById("totalBox").innerHTML =
    "Total Terpakai: " + total + " LITER<br>" +
    "Total Uang: Rp " + (total * 10000).toLocaleString("id-ID");
}

function render(){
  let t = document.getElementById("tabel");
  t.innerHTML = "";

  let arr = Object.entries(data);

  arr.forEach(([key,d],i)=>{

    if(!d.transaksi) d.transaksi = [];

    let kolom = "";

    d.transaksi.forEach((v,j)=>{
      kolom += `
        <div>
          <input class="small"
            type="number"
            value="${v}"
            ${role==="user" ? `onchange="edit('${key}',${j},this)"` : "disabled"}>
          ${role==="user" ? `<button class="del" onclick="hapusTransaksi('${key}',${j})">-</button>` : ""}
        </div>
      `;
    });

    if(role==="user" && d.update > 0){
      kolom += `
        <input class="small"
               type="number"
               placeholder="+"
               onchange="autoTransaksi('${key}',this)">
      `;
    }

    let red = d.update==0 ? "red" : "";

    t.innerHTML += `
      <tr>
        <td>${i+1}</td>
        <td class="${role==="admin" ? "editable" : ""}" onclick="editNama('${key}')">${d.nama}</td>
        <td>${d.stock}</td>
        <td class="${red}">${d.update}</td>
        <td>${kolom}</td>
        <td>
          ${role==="admin" ? `<button class="del" onclick="hapus('${key}')">🗑️</button>` : ""}
        </td>
      </tr>
    `;
  });

  hitungTotal();
}

window.tambah = function(){
  let nama = document.getElementById("nama").value;
  let stok = parseFloat(document.getElementById("stok").value);

  if(!nama || isNaN(stok)) return;

  let newRef = push(ref(db,"pertalite"));

  set(newRef,{
    nama,
    stock:stok,
    update:stok,
    transaksi:[]
  });

  document.getElementById("nama").value="";
  document.getElementById("stok").value="";
};

window.autoTransaksi = function(key,input){
  let val = parseFloat(input.value);
  let d = data[key];

  if(isNaN(val)) return;

  if(val > d.update){
    alert("Tidak boleh melebihi sisa stock!");
    input.value="";
    return;
  }

  d.update -= val;
  d.transaksi.push(val);

  set(ref(db,"pertalite/"+key), d);

  input.value="";
};

window.edit = function(key,j,input){
  let val = parseFloat(input.value);
  let d = data[key];
  let old = d.transaksi[j];

  if(isNaN(val)) return;

  let selisih = val - old;

  if(selisih > d.update){
    alert("Melebihi sisa stock!");
    input.value = old;
    return;
  }

  d.update -= selisih;
  d.transaksi[j] = val;

  set(ref(db,"pertalite/"+key), d);
};

window.hapusTransaksi = function(key,j){
  let d = data[key];
  let val = d.transaksi[j];

  d.update += val;
  d.transaksi.splice(j,1);

  set(ref(db,"pertalite/"+key), d);
};

window.hapus = function(key){
  remove(ref(db,"pertalite/"+key));
};

window.editNama = function(key){
  if(role !== "admin") return;

  let d = data[key];

  let namaBaru = prompt("Edit Nama:", d.nama);
  let stokBaru = prompt("Edit Stock:", d.stock);

  if(namaBaru && !isNaN(parseFloat(stokBaru))){
    d.nama = namaBaru;
    d.stock = parseFloat(stokBaru);

    if(d.update > d.stock) d.update = d.stock;

    set(ref(db,"pertalite/"+key), d);
  }
};

window.copyScript = function(){
  navigator.clipboard.writeText(document.documentElement.outerHTML);
  alert("Script berhasil di copy!");
};

</script>

</body>
</html>
