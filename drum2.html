<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>UMUM</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  padding: 10px;
}

h2 { text-align: center; }

input {
  padding: 8px;
  margin: 5px;
  font-size: 14px;
}

#nama { width: 50%; }
#liter { width: 120px; } /* DIPERKECIL */

button {
  padding: 6px;
  cursor: pointer;
}

.add { background: blue; color: white; }
.logout { background: red; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
}

th, td {
  border: 1px solid #555;
  padding: 6px;
  text-align: center;
}

/* KHUSUS KOLOM LITER */
td:nth-child(3), th:nth-child(3) {
  width: 90px;
}

/* INPUT LITER DI TABEL */
td input[type="number"] {
  width: 70px;
  padding: 4px;
  font-size: 13px;
}

.dex-checked {
  background: #00ff99;
  color: black;
  font-weight: bold;
}

.solar-checked {
  background: orange;
  color: black;
  font-weight: bold;
}

input[type="checkbox"] {
  width: 18px;
  height: 18px;
}

.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.7);
}

.popup-box {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.popup-box button {
  padding: 8px 15px;
  margin: 5px;
  border: none;
  cursor: pointer;
}

.yes { background: limegreen; }
.no { background: red; color: white; }

</style>
</head>

<body>

<h2>DATA UMUM</h2>

<button class="logout" onclick="logout()">Logout</button>

<br>

<input type="text" id="nama" placeholder="Nama">
<input type="number" id="liter" placeholder="Liter">

<button class="add" onclick="tambahData()">Tambah Data</button>

<table>
<thead>
<tr>
<th>No</th>
<th>Nama</th>
<th>Liter</th>
<th>DEX</th>
<th>SOLAR</th>
<th>Aksi</th>
</tr>
</thead>

<tbody id="tbody"></tbody>
</table>

<div id="popup" class="popup">
  <div class="popup-box" onclick="event.stopPropagation()">
    <p id="popupText"></p>
    <button class="yes" onclick="jawabPopup(true)">YA</button>
    <button class="no" onclick="jawabPopup(false)">BELUM</button>
  </div>
</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import {
  getFirestore,
  collection,
  addDoc,
  getDocs,
  deleteDoc,
  doc,
  updateDoc,
  getDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const role = localStorage.getItem("role") || "user";

const firebaseConfig = {
  apiKey: "ISI PUNYA ANDA",
  authDomain: "ISI",
  projectId: "ISI",
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let selectedId = null;
let selectedStatus = null;
let modeCeklis = "";

/* TAMBAH */
window.tambahData = async function() {

  if(role !== "admin") return;

  const nama = document.getElementById("nama").value.toUpperCase();
  const liter = parseFloat(document.getElementById("liter").value);

  if(!nama || !liter) return alert("Isi semua!");

  await addDoc(collection(db, "drum2"), {
    nama,
    liter,
    ceklis: false,
    dexlite: false,
    dexLock: liter < 100
  });

  loadData();
}

/* LOAD */
window.loadData = async function() {

  const snap = await getDocs(collection(db, "drum2"));
  let html = "";
  let no = 1;

  snap.forEach((d) => {

    const data = d.data();

    html += `
    <tr>
      <td>${no++}</td>
      <td>${data.nama}</td>

      <td>
        ${
          role === "admin"
          ? `<input type="number" value="${data.liter}" onchange="updateLiter('${d.id}', this.value)">`
          : data.liter
        }
      </td>

      <td class="${data.dexlite ? "dex-checked" : ""}">
        <input type="checkbox"
          ${data.dexlite ? "checked" : ""}
          ${(role !== "user" || data.dexLock) ? "disabled" : ""}
          onchange="toggleDexlite('${d.id}', this.checked)">
      </td>

      <td class="${data.ceklis ? "solar-checked" : ""}">
        <input type="checkbox"
          ${data.ceklis ? "checked" : ""}
          ${role === "admin" ? "disabled" : ""}
          onchange="toggleCeklis('${d.id}', this.checked)">
      </td>

      <td>
        ${role === "admin" ? `<button onclick="hapusData('${d.id}')">Hapus</button>` : ""}
      </td>
    </tr>
    `;
  });

  document.getElementById("tbody").innerHTML = html;
}

/* UPDATE LITER */
window.updateLiter = async function(id, value){

  if(role !== "admin") return;

  const liter = parseFloat(value);
  if(!liter) return alert("Liter tidak valid");

  await updateDoc(doc(db,"drum2",id),{
    liter: liter,
    dexLock: liter < 100
  });

  loadData();
}

/* DEX */
window.toggleDexlite = async function(id, status){

  const snap = await getDoc(doc(db,"drum2",id));
  const data = snap.data();

  if(data.dexLock) return;
  if(role !== "user") return;

  selectedId = id;
  selectedStatus = status;
  modeCeklis = "dex";

  document.getElementById("popupText").innerText =
    status ? "Apakah DEX sudah terisi?" : "Yakin mau lepas ceklis DEX?";

  document.getElementById("popup").style.display = "flex";
}

/* SOLAR */
window.toggleCeklis = function(id, status){

  if(role !== "user") return;

  selectedId = id;
  selectedStatus = status;
  modeCeklis = "solar";

  document.getElementById("popupText").innerText =
    status ? "Apakah SOLAR sudah terisi?" : "Yakin mau lepas ceklis SOLAR?";

  document.getElementById("popup").style.display = "flex";
}

/* POPUP */
window.jawabPopup = async function(jawab){

  document.getElementById("popup").style.display = "none";

  if(!jawab){
    loadData();
    return;
  }

  if(modeCeklis === "dex"){
    await updateDoc(doc(db,"drum2",selectedId),{
      dexlite: selectedStatus
    });
  } else {
    await updateDoc(doc(db,"drum2",selectedId),{
      ceklis: selectedStatus
    });
  }

  loadData();
}

/* LOCK */
window.hapusData = async function(id){

  if(role !== "admin") return;

  await deleteDoc(doc(db,"drum2",id));
  loadData();
}

/* LOGOUT */
window.logout = function(){
  localStorage.removeItem("role");
  location.href = "index.html";
}

loadData();

</script>
</body>
</html>
