<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>UMUM</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: #fff;
  padding: 10px;
}

h2 { text-align: center; }

input {
  padding: 6px;
  margin: 4px;
  font-size: 14px;
}

#nama { width: 50%; }
#liter { width: 90px; } /* DIPERKECIL */

button {
  padding: 6px;
  cursor: pointer;
}

.add { background: blue; color: white; }
.logout { background: red; color: white; }

table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 10px;
}

th, td {
  border: 1px solid #555;
  padding: 6px;
  text-align: center;
}

/* Kolom nomor */
th:nth-child(1), td:nth-child(1) {
  width: 40px;
}

/* Kolom liter */
th:nth-child(4), td:nth-child(4) {
  width: 90px;
}

td input[type="number"] {
  width: 60px;
}

/* Warna */
.dex-checked {
  background: #00ff99;
  color: black;
  font-weight: bold;
}

.solar-checked {
  background: orange;
  color: black;
  font-weight: bold;
}

/* POPUP */
.popup {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: none;
  justify-content: center;
  align-items: center;
  background: rgba(0,0,0,0.7);
}

.popup-box {
  background: #222;
  padding: 20px;
  border-radius: 10px;
  text-align: center;
}

.popup button {
  margin: 5px;
}
</style>
</head>

<body>

<h2>DATA BBM</h2>

<input type="text" id="nama" placeholder="Nama">
<input type="number" id="liter" placeholder="Liter">
<button class="add" onclick="tambahData()">Tambah</button>

<table>
<thead>
<tr>
  <th>No</th>
  <th>Nama</th>
  <th>Solar</th>
  <th>Liter</th>
  <th>Dexlite</th>
  <th>Aksi</th>
</tr>
</thead>
<tbody id="tabel"></tbody>
</table>

<!-- POPUP -->
<div class="popup" id="popup">
  <div class="popup-box">
    <p id="popupText">Yakin?</p>
    <button onclick="confirmAksi()">Ya</button>
    <button onclick="closePopup()">Batal</button>
  </div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("bbm")) || [];
let indexAksi = null;
let tipeAksi = "";

function simpan() {
  localStorage.setItem("bbm", JSON.stringify(data));
}

function render() {
  const tabel = document.getElementById("tabel");
  tabel.innerHTML = "";

  data.forEach((d, i) => {
    let tr = document.createElement("tr");

    if (d.dex) tr.classList.add("dex-checked");
    if (d.solar) tr.classList.add("solar-checked");

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>${d.nama}</td>
      <td><input type="checkbox" ${d.solar ? "checked" : ""} onchange="cekAksi(${i}, 'solar', this.checked)"></td>
      <td><input type="number" value="${d.liter}" onchange="editLiter(${i}, this.value)"></td>
      <td><input type="checkbox" ${d.dex ? "checked" : ""} onchange="cekAksi(${i}, 'dex', this.checked)"></td>
      <td><button onclick="hapus(${i})">Hapus</button></td>
    `;

    tabel.appendChild(tr);
  });
}

function tambahData() {
  let nama = document.getElementById("nama").value;
  let liter = document.getElementById("liter").value;

  if (!nama || !liter) return alert("Isi dulu!");

  data.push({
    nama,
    liter,
    solar: false,
    dex: false
  });

  simpan();
  render();

  document.getElementById("nama").value = "";
  document.getElementById("liter").value = "";
}

function editLiter(i, val) {
  data[i].liter = val;
  simpan();
}

function hapus(i) {
  data.splice(i, 1);
  simpan();
  render();
}

function cekAksi(i, tipe, status) {
  indexAksi = i;
  tipeAksi = tipe;

  document.getElementById("popupText").innerText =
    status ? "Yakin mau ceklis?" : "Yakin mau lepas ceklis?";

  document.getElementById("popup").style.display = "flex";

  // simpan sementara
  data[i]["temp_" + tipe] = status;
}

function confirmAksi() {
  data[indexAksi][tipeAksi] = data[indexAksi]["temp_" + tipeAksi];
  delete data[indexAksi]["temp_" + tipeAksi];

  simpan();
  render();
  closePopup();
}

function closePopup() {
  document.getElementById("popup").style.display = "none";
}

render();
</script>

</body>
</html>
